name: Deploy to XServer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xserver-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$XSERVER_SSH_KEY" > ~/.ssh/xserver_deploy_key
          chmod 600 ~/.ssh/xserver_deploy_key
          ssh-keyscan -p "$XSERVER_PORT" -H "$XSERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/xserver_deploy_key \
            -p "$XSERVER_PORT" \
            -o IdentitiesOnly=yes \
            "$XSERVER_USER@$XSERVER_HOST" \
            'bash /home/xs930418/laravel/deploy.sh'
